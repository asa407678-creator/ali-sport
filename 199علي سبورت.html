<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>علي سبورت</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{--h1:150;--h2:50;--r:22px;--sp:1;--d:1;color-scheme:light;--bg:hsl(var(--h1) 60% 95%);--fg:hsl(var(--h1) 45% 10%);--card:hsl(0 0% 100%/.72);--ln:hsl(var(--h1) 30% 82%);--mut:hsl(var(--h1) 15% 36%);--ac:hsl(var(--h1) 90% 50%);--ac2:hsl(var(--h2) 96% 56%);--ac3:hsl(calc(var(--h1) + 130) 90% 58%);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:hsl(var(--h1) 50% 6%);--fg:hsl(var(--h1) 30% 96%);--card:hsl(var(--h1) 45% 14%/.6);--ln:hsl(var(--h1) 35% 24%);--mut:hsl(var(--h1) 18% 70%)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:hsl(var(--h1) 50% 6%);--fg:hsl(var(--h1) 30% 96%);--card:hsl(var(--h1) 45% 14%/.6);--ln:hsl(var(--h1) 35% 24%);--mut:hsl(var(--h1) 18% 70%)}
html[dir=rtl]{--d:-1}html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.6;min-height:100vh;overflow-x:hidden}
.bl{position:fixed;width:52vmax;height:52vmax;border-radius:50%;filter:blur(90px);opacity:.38;z-index:-1;animation:bl calc(16s*var(--sp)) ease-in-out infinite alternate}
.b1{background:var(--ac);top:-18vmax;inset-inline-start:-14vmax}.b2{background:var(--ac2);bottom:-20vmax;inset-inline-end:-12vmax;animation-delay:-5s}.b3{background:var(--ac3);top:30%;inset-inline-start:35%;opacity:.2;animation-delay:-9s}
@keyframes bl{to{transform:translate(6vmax,5vmax) scale(1.15)}}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:8px;padding:10px 14px;backdrop-filter:blur(16px);background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid var(--ln)}
.logo{font-weight:900;font-size:24px;margin-inline-end:auto;display:flex;align-items:center;gap:6px}.logo i{font-style:normal;display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));animation:sp calc(6s*var(--sp)) linear infinite}
@keyframes sp{50%{transform:rotate(180deg) scale(1.1)}}
button{font:inherit;color:inherit;cursor:pointer}
.btn,.ib,.gl{position:relative;overflow:hidden;border:0;transition:transform .15s,box-shadow .2s}
.btn{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#06130c;font-weight:900;padding:9px 20px;border-radius:999px;box-shadow:0 6px 20px -6px var(--ac)}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.94)}
.gl{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:8px 14px;backdrop-filter:blur(10px)}
.ib{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--ln);font-size:18px}.ib:active{transform:scale(.88) rotate(15deg)}
.seg{position:relative;display:flex;background:var(--card);border:1px solid var(--ln);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;font-weight:900;z-index:1;color:var(--mut);transition:color .2s}.seg button.on{color:#06130c;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.rp{position:absolute;border-radius:50%;background:#fff8;transform:scale(0);animation:rp .6s forwards;pointer-events:none}@keyframes rp{to{transform:scale(4);opacity:0}}
nav{display:flex;justify-content:center;gap:6px;padding:12px 14px}
nav button{border:1px solid transparent;background:none;color:var(--mut);font-weight:900;padding:9px 18px;border-radius:999px;display:flex;gap:6px;align-items:center;transition:.2s}
nav button.on{background:var(--card);border-color:var(--ac);color:var(--fg);box-shadow:0 0 24px -6px var(--ac)}nav i{font-style:normal}
main{max-width:1180px;margin:0 auto;padding:6px 14px 110px}
section{display:none}section.on{display:block;animation:in .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes in{from{opacity:0;transform:scale(.97) translateY(14px)}}
.tk{overflow:hidden;white-space:nowrap;border-radius:999px;background:var(--card);border:1px solid var(--ln);padding:6px 0;margin-bottom:14px}
.tk div{display:inline-flex;gap:40px;padding-inline:20px;animation:tk calc(30s*var(--sp)) linear infinite}
@keyframes tk{to{transform:translateX(calc(-50% * var(--d)))}}
.hero{position:relative;overflow:hidden;border-radius:calc(var(--r) + 10px);padding:36px 24px 40px;color:#fff;background:linear-gradient(120deg,var(--ac),var(--ac3),var(--ac2),var(--ac));background-size:300% 300%;animation:gr calc(10s*var(--sp)) ease infinite;margin-bottom:18px;text-shadow:0 2px 12px #0005}
@keyframes gr{50%{background-position:100% 50%}}
.hero h1{margin:0;font-weight:900;font-size:clamp(30px,7vw,60px);line-height:1.15;max-width:640px}.hero p{font-size:clamp(15px,3vw,19px);max-width:520px}
.fl{position:absolute;font-size:44px;animation:fl calc(5s*var(--sp)) ease-in-out infinite alternate;filter:drop-shadow(0 8px 10px #0004);text-shadow:none}
@keyframes fl{to{transform:translateY(-22px) rotate(25deg)}}
.rg{position:absolute;border:12px solid #fff5;border-radius:50%;width:180px;height:180px;inset-inline-end:-50px;bottom:-60px;animation:sp calc(14s*var(--sp)) linear infinite}
.card{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:var(--r);padding:16px;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-3px);box-shadow:0 16px 36px -18px var(--ac)}
.card h3{margin:0 0 10px;font-weight:900;font-size:19px}
.grid{display:grid;gap:14px;grid-template-columns:1fr}@media(min-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}}
.sc{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;margin-bottom:6px}
.mc{min-width:250px;scroll-snap-align:start;text-align:center}
.tm{display:flex;justify-content:space-between;align-items:center}.tm b{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;color:#fff;font-size:22px;margin:auto}
.tm div{flex:1;font-weight:900}.res{font-size:26px;font-weight:900}
.lv{display:inline-flex;align-items:center;gap:6px;background:#e11d48;color:#fff;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:900}.lv:before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:pl 1s infinite}
@keyframes pl{50%{opacity:.2;transform:scale(1.6)}}
.pr{height:6px;border-radius:9px;background:var(--ln);margin-top:10px;overflow:hidden}.pr i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:9px}
.nw{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}.nw:last-child{border:0}.nw i{font-style:normal;display:grid;place-items:center;min-width:54px;height:54px;border-radius:16px;font-size:26px}
.mut{color:var(--mut);font-size:13px}
input,select,textarea{width:100%;padding:11px 14px;border:1px solid var(--ln);border-radius:14px;background:var(--card);color:var(--fg);font:inherit;margin:4px 0 10px}input:focus,textarea:focus{outline:2px solid var(--ac)}
video{width:100%;border-radius:calc(var(--r) - 6px);background:#000;aspect-ratio:16/9;display:block}
.fr{position:relative;border-radius:var(--r);padding:5px;background:linear-gradient(135deg,var(--ac),var(--ac2),var(--ac3))}.fr .lv{position:absolute;top:16px;inset-inline-start:16px}
.tp{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}@media(min-width:800px){.tp{grid-template-columns:repeat(5,1fr)}}
.tp canvas{width:100%;border-radius:14px;cursor:pointer;border:3px solid transparent;transition:transform .2s}.tp canvas:hover{transform:scale(1.04)}.tp canvas.on{border-color:var(--ac2)}
#big{width:100%;max-width:400px;display:block;margin:12px auto;border-radius:18px}
.stars button{background:none;border:0;font-size:32px;color:var(--ln);transition:transform .15s}.stars button.on{color:var(--ac2);transform:scale(1.2)}
#pn{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(370px,92vw);z-index:9;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(22px);border-inline-start:1px solid var(--ln);padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));padding-top:calc(18px + env(safe-area-inset-top,0px));overflow-y:auto;transform:translateX(calc(110% * var(--d)));transition:transform .4s cubic-bezier(.2,.9,.3,1.1)}#pn.s{transform:none}
#pn h4{margin:16px 0 6px;font-weight:900}
.pre{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pre span{height:44px;border-radius:14px;cursor:pointer;border:3px solid transparent;transition:transform .15s}.pre span:hover{transform:scale(1.1)}.pre span.on{border-color:var(--fg)}
input[type=range]{padding:0;height:30px;accent-color:var(--ac)}
.pk{display:flex;gap:6px;flex-wrap:wrap}
#toast{position:fixed;bottom:100px;inset-inline:16px;margin:auto;width:max-content;max-width:90vw;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:900;opacity:0;transform:translateY(20px);pointer-events:none;transition:.25s;z-index:20}#toast.s{opacity:1;transform:none}
.mod{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:12;padding:16px}.mod.s{display:flex}
@media(max-width:799px){nav{position:fixed;bottom:12px;inset-inline:12px;z-index:6;padding:6px;border-radius:999px;background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--ln);margin-bottom:env(safe-area-inset-bottom,0px);justify-content:space-around}nav button{flex-direction:column;gap:0;padding:6px 8px;font-size:12px}nav i{font-size:20px}.logo span{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.rg{transform:perspective(500px) rotateX(70deg);animation:rr calc(10s*var(--sp)) linear infinite}
@keyframes rr{to{transform:perspective(500px) rotateX(70deg) rotateZ(360deg)}}
.hero h1,.hero p{position:relative;z-index:2}
.sc3{position:absolute;inset-inline-end:6%;top:14px;width:150px;height:170px;perspective:700px}
.cube{width:90px;height:90px;margin:40px auto;position:relative;transform-style:preserve-3d;animation:cb calc(14s*var(--sp)) linear infinite}
.cube b{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;border:2px solid #fff7;background:linear-gradient(135deg,#fff4,#0004);text-shadow:none}
.cube b:nth-child(1){transform:translateZ(45px)}.cube b:nth-child(2){transform:rotateY(90deg) translateZ(45px)}.cube b:nth-child(3){transform:rotateY(180deg) translateZ(45px)}.cube b:nth-child(4){transform:rotateY(-90deg) translateZ(45px)}.cube b:nth-child(5){transform:rotateX(90deg) translateZ(45px)}.cube b:nth-child(6){transform:rotateX(-90deg) translateZ(45px)}
@keyframes cb{to{transform:rotateX(360deg) rotateY(720deg)}}
.ball{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 28%,#fff,var(--ac2) 38%,#000a 100%);box-shadow:0 22px 28px -10px #0009,inset -8px -10px 18px #0005;animation:fl calc(4s*var(--sp)) ease-in-out infinite alternate}
.tilt{transition:transform .15s}
@media(max-width:799px){.sc3{transform:scale(.55);top:-20px;inset-inline-end:-16px}}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px}.cats button{white-space:nowrap}
.th{display:flex;gap:12px;align-items:center;margin-bottom:8px}.th h3{margin:0 0 2px}
.ico{display:grid;place-items:center;min-width:56px;height:56px;font-size:26px;background:linear-gradient(135deg,var(--ac),var(--ac3))}
.s0{border-radius:50%;box-shadow:inset -5px -7px 12px #0005}.s1{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}.s2{clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.out{margin-top:12px}.rr{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--ln)}.rr b{color:var(--ac)}
label.mut{display:block;margin-top:4px}
.rw{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.seg{flex-wrap:wrap;border-radius:18px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.kp button{padding:14px 0;font-size:20px;border-radius:16px}
.dsp{background:var(--bg);border-radius:16px;padding:12px;text-align:end;direction:ltr;min-height:76px}.dsp b{font-size:30px;display:block}
.mq{font-size:42px;font-weight:900;text-align:center;direction:ltr;margin:10px 0}
.ov{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;min-width:0;font-size:14px}.tbl th{color:var(--mut);font-size:13px}.tbl th,.tbl td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--ln)}.tbl td:nth-child(2),.tbl th:nth-child(2){text-align:start;font-weight:900}.tbl .up td:first-child{color:var(--ac);font-weight:900}.tbl .dn td:first-child{color:#e11d48;font-weight:900}.tbl td:last-child{font-weight:900}
.bar{height:8px;border-radius:9px;background:var(--ln);margin:4px 0 10px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.sr{display:flex;justify-content:space-between;font-size:14px}
.chp{display:inline-block;border-radius:999px;padding:0 10px;font-size:12px;font-weight:900;color:#06130c;background:var(--ac2)}.chp.r{background:#e11d48;color:#fff}.chp.g{background:var(--ac)}
.pl{display:flex;justify-content:space-between;width:100%;margin:5px 0;background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 45%,transparent) var(--p),var(--card) var(--p))}html[dir=rtl] .pl{background:linear-gradient(270deg,color-mix(in srgb,var(--ac) 45%,transparent) var(--p),var(--card) var(--p))}.pl.my{outline:2px solid var(--ac2)}
details{border-bottom:1px solid var(--ln);padding:10px 0}summary{font-weight:900;cursor:pointer}details p{margin:8px 0 0;color:var(--mut)}
#int{display:grid;gap:14px;margin-bottom:14px}@media(min-width:800px){#int{grid-template-columns:repeat(2,1fr)}}
.soc{display:flex;justify-content:center;gap:14px;margin:26px 0 0}.soc a,.soc button{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--ln);color:var(--fg);transition:transform .2s,box-shadow .2s}.soc a:hover,.soc button:hover{transform:translateY(-4px) rotate(-6deg);box-shadow:0 10px 24px -8px var(--ac)}.soc svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pv{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}.pv:last-child{border:0}.pv>span{flex:1}
@media(max-width:480px){.tbl{font-size:12.5px}.tbl th,.tbl td{padding:8px 2px}.card{padding:12px}}
nav{flex-wrap:wrap}@media(max-width:799px){nav{overflow-x:auto;flex-wrap:nowrap;justify-content:flex-start;scrollbar-width:none}nav::-webkit-scrollbar{display:none}nav button{flex:0 0 auto;min-width:62px}}
#fab{position:fixed;inset-inline-end:14px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:8;width:56px;height:56px;padding:0;font-size:26px;border-radius:50%}@media(min-width:800px){#fab{bottom:24px}}
#fm{position:fixed;inset-inline-end:14px;bottom:calc(164px + env(safe-area-inset-bottom,0px));z-index:8;width:min(300px,86vw);display:none}#fm.s{display:block;animation:in .25s}@media(min-width:800px){#fm{bottom:92px}}
.fx{position:absolute;bottom:10px;inset-inline-start:45%;font-size:34px;pointer-events:none;animation:fxu 1.2s forwards}@keyframes fxu{to{transform:translateY(-130px) scale(1.7);opacity:0}}
#fab{width:auto;height:58px;padding:0 22px;font-size:18px;font-weight:900;border-radius:999px;white-space:nowrap}
@media(max-width:799px){nav button{font-size:13px;min-width:70px;padding:8px 10px}nav i{font-size:24px}}
</style>

<body>
<div class="bl b1"></div><div class="bl b2"></div><div class="bl b3"></div>
<header>
<div class="logo"><i>⚽</i><span>علي سبورت</span></div>
<div class="seg" id="lang"><button data-l="ar" class="on" data-s="tog">ع</button><button data-l="en" data-s="tog">EN</button></div>
<button class="ib" id="sn" data-s="tog">🔊</button>
<button class="ib" id="pb" data-s="nav">🎨</button>
<button class="btn" id="lgn" data-i="login" data-s="ok">دخول</button>
</header>
<nav id="nav"></nav>
<main>
<section id="home" class="on">
<div class="tk"><div id="tk"></div></div>
<div class="hero"><div class="sc3"><div class="cube"><b>⚽</b><b>🏀</b><b>🏆</b><b>🎯</b><b>🥇</b><b>🏟️</b></div></div><span class="ball" style="width:70px;height:70px;top:30px;inset-inline-end:36%"></span><span class="ball" style="width:46px;height:46px;bottom:26px;inset-inline-end:44%;animation-delay:-2s"></span><span class="ball" style="width:34px;height:34px;top:120px;inset-inline-end:3%;animation-delay:-3s"></span><span class="rg"></span>
<h1 data-i="h1">كل الرياضة بمكان واحد</h1><p data-i="h2">نتائج، أخبار، قوالب، وأدوات بالعربي والإنجليزي</p></div>
<h3 style="font-weight:900;margin:0 4px 8px" data-i="today">مباريات اليوم</h3>
<div class="sc" id="mt"></div><div class="mut" data-i="demo">بيانات تجريبية</div>
<div class="card" style="margin-top:14px"><h3 data-i="news">آخر الأخبار</h3><div id="nw"></div></div>
</section>
<section id="live"></section>
<section id="tpl"><div class="card"><h3 data-i="tp">قوالب</h3>
<input type="file" id="ph" accept="image/*"><input id="nm" placeholder="الاسم"><div class="tp" id="tl"></div>
<canvas id="big" width="1080" height="1350"></canvas><div style="text-align:center"><button class="btn" id="dl" data-i="dl" data-s="ok">تنزيل</button></div></div></section>
<section id="tools"></section>
<section id="lg"></section>
<section id="rev"><div id="int"></div><div class="card"><h3 data-i="rv">رأيك</h3><div class="stars" id="st"></div><textarea id="tx" rows="3"></textarea><button class="btn" id="sv" data-i="send" data-s="ok">إرسال</button><div id="rl" style="margin-top:12px"></div></div></section>
<footer id="so"></footer></main>
<aside id="pn"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0;font-weight:900" data-i="pnl">لوحة التحكم</h3><button class="ib" id="px" data-s="nav">✕</button></div>
<h4 data-i="pre">ثيمات</h4><div class="pre" id="pre"></div>
<h4>🎨 ألوان أساسية / Base colors</h4><div class="pre" id="pcl"></div><h4 data-i="c1">اللون الأول</h4><input type="range" id="r_h1" min="0" max="360">
<h4 data-i="c2">اللون الثاني</h4><input type="range" id="r_h2" min="0" max="360">
<h4 data-i="rad">الاستدارة</h4><input type="range" id="r_r" min="6" max="34">
<h4 data-i="spd">سرعة الحركة</h4><input type="range" id="r_sp" min="30" max="300">
<h4 data-i="vol">مستوى الصوت</h4><input type="range" id="r_v" min="0" max="100">
<h4 data-i="pk">نمط الأصوات</h4><div class="pk" id="pk"></div>
<h4 data-i="th">الوضع</h4><div class="seg" id="th" style="width:max-content"><button data-t="dark" class="on" data-s="tog"></button><button data-t="light" data-s="tog"></button></div>
<div style="margin-top:18px"><button class="gl" id="rs" data-i="rs" data-s="tog">إعادة ضبط</button></div></aside>
<div class="mod" id="md"><div class="card" style="max-width:340px;width:100%"><h3 data-i="login">دخول</h3><button class="gl" style="width:100%;margin-bottom:8px" id="gg" data-s="err">Google</button><button class="gl" style="width:100%;margin-bottom:8px" id="ph2" data-s="err">📱</button><button class="gl" style="width:100%" id="cl" data-s="tog">✕</button></div></div>
<button class="btn" id="fab" data-s="ok" aria-label="تفاعل">🔥 شريط التفاعل</button><div id="fm" class="card"></div>
<div id="toast"></div>
<script>
